<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Syntra Solutions | Prisma Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6fb;--sf:#fff;--tx:#14142b;--mu:#5b5f7a;--ac:#5b3df5;--on:#fff;--am:#ffd54a;--dk:#16134a;--lm:#22d3ee;--bd:#e2e2f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0b1f;--sf:#16153a;--tx:#ecebff;--mu:#a5a8cc;--ac:#8b7bff;--on:#0c0b1f;--bd:#2a2960;--dk:#1b1855;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0b1f;--sf:#16153a;--tx:#ecebff;--mu:#a5a8cc;--ac:#8b7bff;--on:#0c0b1f;--bd:#2a2960;--dk:#1b1855;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
header{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;padding:.7rem 1.25rem;background:var(--sf);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;font-weight:800;font-size:1.1rem;margin-right:auto}.brand small{font-weight:500;color:var(--mu);margin-left:.3rem}
.logo{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--ac);color:var(--on);font-weight:800;margin-right:.6rem}
nav{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center}
.b{font:inherit;font-weight:600;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:.5rem 1rem;border-radius:999px;cursor:pointer}
.b:hover{border-color:var(--ac)}.b:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--am);outline-offset:1px}
.b.pri{background:var(--ac);color:var(--on);border-color:var(--ac)}
.b.dk{background:#14142b;color:#fff;border-color:#14142b}
.b.lk{border-color:transparent;background:none}
main{max-width:1100px;margin:0 auto;padding:1.25rem}
.tick{background:var(--lm);color:#14142b;overflow:hidden;white-space:nowrap;margin:-1.25rem -1.25rem 0;font-weight:800}
.tick span{display:inline-block;padding:.5rem 0;animation:mq 40s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.tick span{animation:none}}
.hs{display:grid;grid-template-columns:1.1fr 1fr;gap:1.5rem;align-items:center;background:linear-gradient(120deg,#4527d9,#7c4dff 55%,#22d3ee);color:#fff;margin:-1.25rem -1.25rem 0;padding:2rem 1.25rem}
.hs h1{font-weight:300;font-size:clamp(2rem,5vw,3.1rem)}.hs h1 b{font-weight:800}.hs p{max-width:46ch}
.hs .b{border-color:#fff;color:#fff;background:transparent}.hs .b.dk{background:#fff;color:#2a1a8f;border-color:#fff}
.vis{background:linear-gradient(135deg,#ff8fb8 0 35%,#22d3ee 35% 55%,#ffd54a 55%);border-radius:24px;min-height:320px;display:grid;place-items:center;padding:1rem}
.phone{background:#fff;color:#14142b;border:6px solid #14142b;border-radius:28px;width:230px;padding:.9rem;box-shadow:0 14px 30px rgba(0,0,0,.25)}
.phone div{display:flex;justify-content:space-between;gap:.5rem;font-size:.75rem;padding:.4rem .5rem;margin:.3rem 0;border:1px solid #e6e6f5;border-radius:8px}
.promo{background:var(--dk);color:#fff;border-radius:28px 0 28px 0;padding:1.25rem 1.5rem;display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;margin:1.5rem 0}
.promo h2{color:var(--am);margin:0}
.tabs{display:flex;gap:.5rem;justify-content:center;margin:2rem 0 1rem}
.tab2{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center}
.ft{list-style:none;padding:0;margin:0}.ft li{padding:.6rem 0 .6rem 2rem;position:relative}.ft li::before{content:"✓";position:absolute;left:0;top:.5rem;width:1.4rem;height:1.4rem;border-radius:50%;border:2px solid var(--ac);color:var(--ac);display:grid;place-items:center;font-size:.8rem;font-weight:800}
.gp{background:linear-gradient(160deg,var(--ac),var(--dk));border-radius:90px 0 0 0;min-height:260px;display:grid;place-items:center;padding:1rem}
.badge{background:rgba(255,255,255,.8);color:#14142b;border-radius:20px;padding:1rem 1.4rem;font-size:2.4rem;font-weight:800}.badge span{display:block;font-size:1rem;font-weight:600}
.fab{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--ac);color:var(--on);font-size:1.5rem;border:0;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.3);z-index:50}
@media(max-width:760px){.hs,.tab2{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem;margin:1rem 0}
.card{background:var(--sf);border:2px solid var(--bd);border-radius:20px;padding:1.1rem}.grid .card:hover{border-color:var(--lm)}
.card .pr{font-weight:800;font-size:1.2rem;margin:.5rem 0}
form{display:grid;gap:.75rem;max-width:420px;margin:1rem 0}
label{display:grid;gap:.25rem;font-size:.9rem;color:var(--mu)}
input,select{font:inherit;padding:.55rem .7rem;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);width:100%}
.msg{background:var(--am);color:#1b1b1b;padding:.6rem .9rem;border-radius:10px;margin:1rem 0}
.mu{color:var(--mu)}
.tw{overflow-x:auto;margin:1rem 0}table{border-collapse:collapse;width:100%;min-width:480px}
th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--bd);vertical-align:top}th{font-size:.85rem;color:var(--mu)}
.lay{display:grid;grid-template-columns:230px 1fr;gap:1.25rem}
@media(max-width:760px){.lay{grid-template-columns:1fr}}
aside{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:.75rem;align-self:start}
aside h3{font-size:.95rem;margin:.75rem 0 .25rem}aside h3:first-child{margin-top:0}
aside .b{display:block;width:100%;text-align:left;border-color:transparent;padding:.3rem .7rem;border-radius:10px}
aside .b.on{background:var(--ac);color:var(--on)}
.msgs{height:300px;overflow:auto;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:.5rem;margin:.75rem 0}
.m{margin:.3rem 0;padding:.4rem .6rem;background:var(--sf);border-radius:12px;max-width:80%}.m b{display:block;font-size:.75rem;color:var(--mu)}
.m.me{margin-left:auto;background:var(--ac);color:var(--on)}.m.me b{color:var(--on)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.test{font-size:.9rem}.test td{padding:.25rem .5rem}
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:9999}
.popup-card{background:var(--sf);border:2px solid var(--ac);border-radius:20px;padding:1.5rem;max-width:420px;width:90%;box-shadow:0 10px 25px rgba(0,0,0,.3);text-align:center}
.popup-card h3{margin-top:0;color:var(--ac)}
.popup-actions{display:flex;gap:.5rem;justify-content:center;margin-top:1rem}
.pin-display{background:var(--dk);color:var(--lm);font-size:1.8rem;font-weight:800;letter-spacing:4px;padding:.5rem 1rem;border-radius:12px;margin:1rem 0;display:inline-block;border:1px dashed var(--lm)}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
const generateRandomPin = () => Math.floor(100000 + Math.random() * 900000).toString();
let currentValidationPin = null;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>'R$ '+Number(n).toFixed(2).replace('.',',');
const dt=t=>new Date(t).toLocaleString('pt-BR');
// ===== BANCO DE DADOS =====
// Preencha para ligar o banco compartilhado (Supabase). Vazio = modo local (só neste navegador).
const CLOUD=Object.assign({url:'',key:''},window.CLOUD_CFG||{});CLOUD.url=String(CLOUD.url||'').trim().replace(/\/+$/,'').replace(/\/rest\/v1$/,'');CLOUD.key=String(CLOUD.key||'').trim();if(/SEU-PROJETO/.test(CLOUD.url)||!CLOUD.key)CLOUD.url='';
const HD=()=>{const h={apikey:CLOUD.key};if(/^eyJ/.test(CLOUD.key))h.Authorization='Bearer '+CLOUD.key;return h};
let cst=CLOUD.url?'Conectando ao banco...':'Modo local: banco não configurado (dados só neste aparelho)';
const mem={};let pend=0;
const lset=(k,v)=>{mem[k]=v;try{localStorage.setItem('et_'+k,JSON.stringify(v))}catch(e){}};
const S={get(k,d){try{const v=localStorage.getItem('et_'+k);return v===null?(k in mem?mem[k]:d):JSON.parse(v)}catch(e){return k in mem?mem[k]:d}},
set(k,v){lset(k,v);if(CLOUD.url){pend++;fetch(CLOUD.url+'/rest/v1/kv?on_conflict=key',{method:'POST',headers:{...HD(),'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify({key:k,value:v})}).then(r=>{if(!r.ok)cst='Erro ao gravar no banco ('+r.status+')'}).catch(()=>{cst='Sem conexão com o banco'}).finally(()=>pend--)}}};
async function pull(){if(!CLOUD.url||pend)return false;const old=cst;let ch=false;try{const r=await fetch(CLOUD.url+'/rest/v1/kv?select=key,value',{headers:HD()});if(!r.ok){cst=(r.status===401||r.status===403)?'Banco recusou a chave (confira o config.js e o SQL)':r.status===404?'Tabela kv não encontrada (rode o supabase-setup.sql)':'Erro do banco ('+r.status+')'}else{cst='Banco online';const rk=new Set();for(const x of await r.json()){rk.add(x.key);if(JSON.stringify(S.get(x.key))!==JSON.stringify(x.value)){lset(x.key,x.value);ch=true}}if(!rk.has('users')&&S.get('users'))S.set('users',S.get('users'))}}catch(e){cst='Sem conexão com o banco'}return ch||cst!==old}
async function dl(n,data,mime){const b=new Blob([data],{type:mime});try{const d=window.claude&&claude.use?await claude.use('downloads'):null;if(d){await d.save({filename:n,data:b});return}}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove()}
async function xl(sh,fn){if(typeof XLSX==='undefined')return false;const W=XLSX.utils.book_new();for(const [n,r] of sh)XLSX.utils.book_append_sheet(W,XLSX.utils.json_to_sheet(r.length?r:[{Aviso:'Sem dados'}]),n.slice(0,31));await dl(fn,XLSX.write(W,{bookType:'xlsx',type:'array'}),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');return true}
function mkdoc(o,t){const T={pg:'Documento de pagamento',ct:'Contrato de prestação de serviços',nf:'Nota fiscal (demonstrativa) '+(o.nf||'')};const it=o.itens.map(i=>`<tr><td>${esc(i.n)}</td><td>${i.q}</td></tr>`).join('');const p=o.pag||'';let x='';
if(t==='pg')x=p==='Pix'?`<p><b>Pix (demonstração)</b><br>Chave: pagamentos@syntra.exemplo<br>Código: ${o.doc.cod}</p>`:p==='Boleto'?`<p><b>Boleto (demonstração)</b><br>Linha digitável: 00190.00009 ${o.doc.cod.slice(0,5)}.${o.doc.cod.slice(5)} 00000.000000 1 ${String(Math.round(o.total*100)).padStart(10,'0')}<br>Vencimento: ${new Date(o.doc.ts+3*864e5).toLocaleDateString('pt-BR')}</p>`:`<p><b>${esc(p)}</b><br>O link de pagamento seguro será enviado pela operadora (demonstração).</p>`;
if(t==='ct')x=`<p>As partes concordam com a contratação dos serviços acima, conforme aprovação registrada em ${dt(o.doc.ts)}. Documento de demonstração, sem validade jurídica.</p>`;
return `<!doctype html><meta charset="utf-8"><title>${T[t]} ${o.id}</title><body style="font-family:system-ui,sans-serif;max-width:680px;margin:2rem auto;padding:0 1rem"><h1>Syntra Solutions</h1><h2>${T[t]} nº ${o.id}</h2><p>Cliente: ${esc(o.nome)} (${esc(o.cli)})<br>Emitido em ${dt(Date.now())}</p><table border="1" cellpadding="6" style="border-collapse:collapse"><tr><th>Serviço</th><th>Qtd</th></tr>${it}</table><p><b>Total: ${R(o.total)}</b><br>Forma de pagamento: ${esc(p)}</p>${x}</body>`}
const CAT=[{id:1,n:'Consultoria empresarial',p:1500,d:'Diagnóstico e plano de crescimento para sua empresa.'},{id:2,n:'Gestão de folha e RH',p:900,d:'Ponto, holerites e admissões com acompanhamento.'},{id:3,n:'Contabilidade mensal',p:700,d:'Fechamento, impostos e relatórios todo mês.'},{id:4,n:'Desenvolvimento de sistemas',p:3200,d:'Sites e sistemas sob medida, com suporte.'}];
const SEED_RAW=[['adm@teste.com','Administrador','adm','Adm@12345',9000,'Administrador'],['rh@teste.com','Maria (RH)','rh','Rh@12345',4500,'Analista de RH'],['fin@teste.com','Paulo (Financeiro)','fin','Fin@12345',4800,'Analista financeiro'],['cont@teste.com','Ana (Contabilidade)','cont','Cont@12345',4600,'Contadora'],['colab@teste.com','Carlos (Colaborador)','colab','Colab@12345',3200,'Atendente'],['cliente@teste.com','Cliente Teste','cliente','Cliente@12345',0,'']];
const ROLES={adm:['ponto','prod','rh','fin','cont','atend'],rh:['ponto','rh'],fin:['ponto','fin'],cont:['ponto','cont'],colab:['ponto','atend','banco_dados']};
const RN={adm:'Administrador',rh:'RH',fin:'Financeiro',cont:'Contabilidade',colab:'Colaborador',cliente:'Cliente'};
const G={ponto:['Gestão de ponto',['Controle de ponto','Registrar ponto','Ajustar ponto','Holerite','Escala']],prod:['Gestão de produto',['Pedidos','Contratados','Gerar NF','Estoque','Saldo CNPJ']],rh:['RH',['Folha de ponto de todos','Ajuste de ponto de todos','Admissão/Demissão','Exame admissional','Exame demissional','Departamento pessoal','Holerite de todos','Gestão de documentos']],fin:['Financeiro',['Aprovar pedidos','Valores a receber','Pedidos de clientes','Recebimento de valores','Valores aprovados']],cont:['Contabilidade',['Salário dos funcionários','Valores recebidos','Saldo CNPJ','Repasse de valores']],atend:['Atendimento ao cliente',['Chat','Produtos','Aceitar atendimento','Encerrar atendimento']],banco_dados:['Banco de dados',['Contratações dos clientes']]};
G.inicio=['Início',['Painel','Feed']];for(const k in ROLES)ROLES[k].unshift('inicio');
G.seg=['Segurança',['Redefinir senhas']];ROLES.adm.push('seg');
G.exp=['Exportar dados',['Exportar Excel']];ROLES.adm.push('exp');

let tab='emp',me=null,pg='home',rt='',sel=null,msg='',dismissedPopups=new Set(),cart=S.get('cart',[]);
let pendingUserEmail = null;

try{ me=sessionStorage.getItem('et_me'); }catch(e){}

const U=()=>S.get('users',[]);
const usr=()=>U().find(u=>u.email===me&&u.ativo);
const name=e=>(U().find(x=>x.email===e)||{}).nome||e;
async function hs(p,s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const salt=()=>[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,'0')).join('');
async function mk(email,nome,role,pw,sal,cargo){const s=salt();return{email,nome,role,salt:s,h:await hs(pw,s),sal,cargo,ativo:true}}
const pwOk=p=>p.length>=8&&/[A-Za-z]/.test(p)&&/\d/.test(p);
const tbl=(h,r)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.length?r.map(c=>`<tr>${c.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="mu">Nada por aqui ainda.</td></tr>`}</tbody></table></div>`;
const btn=(a,v,t,c='')=>`<button class="b ${c}" data-a="${a}" data-v="${esc(v)}">${t}</button>`;
const money=a=>a.reduce((s,o)=>s+o.total,0);

function chatBox(c,can){return `<div id="msgs" class="msgs">${c.msgs.map(m=>`<p class="m ${m.de===me?'me':''}"><b>${esc(name(m.de))}</b>${esc(m.t)}</p>`).join('')||'<p class="mu">Sem mensagens.</p>'}</div>`+(can?`<form data-f="msg" data-c="${c.id}" style="max-width:none;grid-template-columns:1fr auto"><input id="ci" name="t" autocomplete="off" required maxlength="500" placeholder="Digite sua mensagem"><button class="b pri">Enviar</button></form>`:'')}
function lista(k){const L=S.get('l_'+k,[]);return `<form data-f="lista" data-k="${esc(k)}"><label>Descrição<input name="d" required maxlength="200"></label><label>Valor (opcional)<input name="v" type="number" step="0.01" min="0"></label><button class="b pri">Adicionar</button></form>`+tbl(['Data','Autor','Descrição','Valor'],L.slice().reverse().map(x=>[dt(x.ts),esc(name(x.e)),esc(x.d),x.v?R(x.v):'']))}
function saldo(){const P=S.get('pedidos',[]),rec=money(P.filter(o=>o.rec)),fol=U().filter(x=>x.role!=='cliente'&&x.ativo).reduce((s,x)=>s+(x.sal||0),0),rep=S.get('l_Repasse de valores',[]).reduce((s,x)=>s+(+x.v||0),0);return tbl(['Recebido','Folha mensal','Repasses','Saldo do CNPJ'],[[R(rec),R(fol),R(rep),`<b>${R(rec-fol-rep)}</b>`]])}

const feedList=F=>F.length?F.map(x=>`<div class="card" style="margin:.5rem 0"><b>${esc(name(x.e))}</b> <span class="mu">${dt(x.ts)}</span><p style="margin:.25rem 0 0">${esc(x.t)}</p></div>`).join(''):'<p class="mu">Nada no feed ainda.</p>';
const fd=t=>{const F=S.get('feed',[]);F.push({e:me,t,ts:Date.now()});S.set('feed',F.slice(-100))};

function item(n){
const u=usr(),P=S.get('pedidos',[]),E=U().filter(x=>x.role!=='cliente'),T=S.get('ponto',[]),A=S.get('ajustes',[]),C=S.get('chats',[]);
const orders=(f,acts)=>tbl(['Pedido','Cliente','Itens','Total','Status',''],P.filter(f).map(o=>['#'+o.id,esc(o.nome),esc(o.itens.map(i=>i.q+'x '+i.n).join(', ')),R(o.total),o.st+(o.rec?' (recebido)':'')+'<br><small class="mu">'+esc(o.pag||'')+'</small>',acts?acts(o):'']));
const hol=x=>{const b=x.sal||0,i=b*.11;return[esc(x.nome),R(b),R(i),R(b-i)]};
const HH=['Funcionário','Bruto','Descontos','Líquido'];
const exam=k=>{const X=S.get('ex_'+k,{});return tbl(['Funcionário','Status',''],E.map(x=>[esc(x.nome),X[x.email]?'Realizado':'Pendente',btn('exam',k+'|'+x.email,X[x.email]?'Reabrir':'Marcar realizado')]))};
switch(n){
case 'Exportar Excel':return u.role!=='adm'?'':`<form data-f="xl" style="max-width:560px"><label>Funcionário<select name="e"><option value="*">Todos os funcionários</option>${E.filter(x=>x.ativo).map(x=>`<option value="${esc(x.email)}">${esc(x.nome)}</option>`).join('')}</select></label><div class="row">${['Folha de ponto','Holerite','Pagamento','Pedidos e contratos','Clientes e acessos'].map(k=>`<button class="b pri" name="k" value="${k}">${k}</button>`).join('')}</div><p class="mu">Escolha um funcionário para exportar de forma individual. Pedidos e clientes exportam tudo.</p></form>`;
case 'Redefinir senhas':return u.role!=='adm'?'':tbl(['Pedidos de nova senha','Solicitado em',''],S.get('reset_req',[]).map(q=>[esc(name(q.e))+' ('+esc(q.e)+')',dt(q.ts),btn('rqdel',q.e,'Descartar')]))+`<form data-f="reset"><label>Funcionário<select name="e">${U().filter(x=>x.ativo&&x.email!==me).map(x=>`<option value="${esc(x.email)}">${esc(x.nome)} (${RN[x.role]})</option>`).join('')}</select></label><label>Nova senha (8+ caracteres, letras e números)<input type="password" name="n" required minlength="8" autocomplete="new-password"></label><button class="b pri">Redefinir senha</button></form><p class="mu">Informe a senha temporária à pessoa. No próximo acesso ela será obrigada a criar uma senha nova.</p>`;

$('#app').innerHTML=`<header><span class="brand"><span class="logo">S</span>Syntra Solutions<small>/ Prisma Portal</small></span><nav>${st?'':btn('go','home','Serviços','lk')}${showSpecHeader?btn('go','especialista','Falar com o especialista','lk'):''}${st?'':btn('go','carrinho','Carrinho ('+cart.reduce((s,x)=>s+x.q,0)+')','lk')}${u&&!st?btn('go','pedidos','Meus pedidos','lk'):''}${st?btn('go','portal','Portal','lk')+btn('bp','','Bater ponto','lk'):''}${u?`<span class="mu">${esc(u.nome)} (${RN[u.role]})</span>${btn('go','pw','Alterar senha','lk')}${btn('out','','Sair')}`:btn('go','login','Entrar','pri')}</nav></header><main>${msg?`<div class="msg" role="status">${esc(msg)}</div>`:''}${mainContent}<p class="mu" style="text-align:center;font-size:.8rem">● ${esc(cst)}</p></main>${pendingUserEmail ? renderPinModal() : ''}${waitingChat ? renderPopupModal(waitingChat) : ''}${showSpecHeader&&pg!=='especialista'?'<button class="fab" data-a="go" data-v="especialista" aria-label="Falar com o especialista">💬</button>':''}`;

msg='';const n=$('#ci');if(n&&cv){n.value=cv;n.focus()}const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}

async function act(a,v){if(CLOUD.url)await pull();
const P=S.get('pedidos',[]),setP=()=>S.set('pedidos',P),o=P.find(x=>x.id==v),u=usr();
switch(a){
case 'cancel_pin':
  pendingUserEmail = null;
  currentValidationPin = null;
  msg = 'Validação cancelada.';
  break;
case 'go':pg=v;if(v==='portal')rt='';break;
case 'rt':rt=v;break;
case 'sel':sel=+v;break;
case 'out':me=null;pg='home';try{sessionStorage.removeItem('et_me')}catch(e){}break;
case 'add':{const c=CAT.find(x=>x.id==v),i=cart.find(x=>x.id==v);i?i.q++:cart.push({id:c.id,n:c.n,p:c.p,q:1});S.set('cart',cart);msg='Adicionado ao carrinho.';break}
case 'rm':cart.splice(+v,1);S.set('cart',cart);break;
case 'checkout':if(!u){pg='login';msg='Entre ou crie uma conta para contratar.'}else if(u.role!=='cliente'){msg='Use uma conta de cliente para contratar.'}else{P.push({id:P.length+1001,cli:me,nome:u.nome,itens:cart.map(x=>({n:x.n,q:x.q})),total:cart.reduce((s,x)=>s+x.p*x.q,0),st:'Pendente',pag:($('#fp')||{}).value||'Pix',rec:false,nf:null,ts:Date.now()});setP();cart=[];S.set('cart',cart);pg='pedidos';msg='Pedido enviado para aprovação.'}break;
case 'bater':{const T=S.get('ponto',[]);T.push({e:me,tipo:v,ts:Date.now()});S.set('ponto',T);fd('registrou '+v.toLowerCase());msg=v+' registrada.';break}
case 'ajok':{const A=S.get('ajustes',[]),x=A.find(y=>y.id==v);if(x){x.st='Aprovado';S.set('ajustes',A);const T=S.get('ponto',[]);T.push({e:x.e,tipo:'Ajuste',ts:new Date(x.d).getTime()});S.set('ponto',T)}break}
case 'apr':if(o&&u&&u.role==='adm'){o.st='Aprovado';o.doc={ts:Date.now(),cod:String(Math.floor(Math.random()*1e12)).padStart(12,'0')};setP();fd('aprovou o pedido #'+o.id)}break;
case 'rec':if(o){o.st='Recusado';setP()}break;
case 'recv':if(o){o.rec=true;setP()}break;
case 'nf':if(o&&u&&u.role==='adm'){o.nf=String(o.id).padStart(6,'0');setP();fd('gerou a NF '+o.nf);msg='NF '+o.nf+' gerada.'}else msg='Somente o adm pode gerar NF. Use Transferir para o adm.';break;
case 'trf':if(o&&!o.nf){o.tr={por:me,ts:Date.now()};setP();fd('transferiu o pedido #'+o.id+' ao adm para emitir a NF');msg='Pedido transferido ao adm.'}break;
case 'ctr':{const C=S.get('chats',[]),c=C.find(x=>x.id==v);if(c){c.st='Aguardando';c.ag=null;c.adm=true;S.set('chats',C);fd('transferiu o atendimento de '+c.nome+' ao adm');msg='Atendimento transferido ao adm.'}break}
case 'tab':tab=v;break;
case 'rqdel':if(u&&u.role==='adm')S.set('reset_req',S.get('reset_req',[]).filter(q=>q.e!==v));break;
case 'docpg':case 'contr':case 'nfdl':if(o&&(o.doc||o.nf)&&(o.cli===me||(u&&u.role!=='cliente')))await dl((a==='docpg'?'pagamento-':a==='contr'?'contrato-':'nf-')+o.id+'.html',mkdoc(o,a==='docpg'?'pg':a==='contr'?'ct':'nf'),'text/html');break;
case 'bp':pg='portal';rt='ponto:Registrar ponto';break;
case 'est':{const [i,d]=v.split(','),L=S.get('estoque',[{n:'Licença de software',q:20},{n:'Kit de implantação',q:8}]);L[i].q=Math.max(0,L[i].q+ +d);S.set('estoque',L);break}
case 'dem':{const L=U(),x=L.find(y=>y.email===v);if(x&&x.email!==me){x.ativo=false;S.set('users',L)}break}
case 'exam':{const [k,e]=v.split('|'),X=S.get('ex_'+k,{});X[e]=!X[e];S.set('ex_'+k,X);break}
case 'chat':{const C=S.get('chats',[]);C.push({id:Date.now(),cli:me,nome:u.nome,st:'Aguardando',msgs:[]});S.set('chats',C);break}
case 'acc':case 'fim':{const C=S.get('chats',[]),c=C.find(x=>x.id==v);if(c){if(a==='acc'){c.st='Em atendimento';c.ag=me;sel=c.id;pg='portal';rt='atend:Chat';fd('aceitou o atendimento de '+c.nome)}else{c.st='Encerrado';fd('encerrou o atendimento de '+c.nome)}S.set('chats',C)}break}
case 'dismiss_pop':dismissedPopups.add(+v);break;
}render()}

async function submit(f,sb){if(CLOUD.url)await pull();
const d=f.dataset.f,u=usr();
if(d==='login'){
  const em=f.email.value.trim().toLowerCase(),L=S.get('lock',{}),k=L[em]||{n:0,t:0};
  if(Date.now()<k.t){msg='Muitas tentativas. Aguarde 1 minuto.';return render()}
  const x=U().find(y=>y.email===em&&y.ativo);
  if(x&&await hs(f.pw.value,x.salt)===x.h){
    delete L[em];S.set('lock',L);
    currentValidationPin = generateRandomPin();
    pendingUserEmail = em;
  } else {
    k.n++;if(k.n>=5){k.t=Date.now()+60000;k.n=0}L[em]=k;S.set('lock',L);msg='E-mail ou senha incorretos.';
  }
}
else if(d==='validate_pin'){
  if(f.pin.value.trim()===currentValidationPin && pendingUserEmail){
    me = pendingUserEmail;
    const x = U().find(y=>y.email===me);
    pendingUserEmail = null;
    currentValidationPin = null;
    try{sessionStorage.setItem('et_me',me)}catch(e){}
    pg=x.must?'pw':(x.role==='cliente'?'home':'portal');rt='';
    {const Ac=S.get('acessos',[]);Ac.push({e:me,ts:Date.now()});S.set('acessos',Ac.slice(-500))}msg=x.must?'Defina uma nova senha para continuar.':'Acesso validado com sucesso!';
  } else {
    msg='Código PIN incorreto. Tente novamente.';
  }
}
else if(d==='reg'){const e=f.e.value.trim().toLowerCase(),L=U();
if(L.find(x=>x.email===e))msg='Este e-mail já tem cadastro.';else if(!pwOk(f.p.value))msg='A senha precisa de 8+ caracteres, com letras e números.';
else{L.push(await mk(e,f.n.value.trim(),'cliente',f.p.value,0,''));S.set('users',L);me=e;try{sessionStorage.setItem('et_me',e)}catch(x){}pg='home';msg='Conta criada.'}}
else if(d==='pw'){const L=U(),x=L.find(y=>y.email===me);
if(await hs(f.a.value,x.salt)!==x.h)msg='A senha atual está incorreta.';else if(f.n.value!==f.c.value)msg='A confirmação não confere.';else if(!pwOk(f.n.value))msg='A senha precisa de 8+ caracteres, com letras e números.';
else{x.salt=salt();x.h=await hs(f.n.value,x.salt);delete x.must;S.set('users',L);msg='Senha alterada.';pg=x.role==='cliente'?'home':'portal'}}
else if(d==='ajuste'){const A=S.get('ajustes',[]);A.push({id:Date.now(),e:me,d:f.d.value,m:f.m.value.trim(),st:'Pendente'});S.set('ajustes',A);msg='Ajuste solicitado.'}
else if(d==='lista'){const k=f.dataset.k,L=S.get('l_'+k,[]);L.push({e:me,d:f.d.value.trim(),v:f.v.value,ts:Date.now()});S.set('l_'+k,L)}
else if(d==='admit'){const e=f.e.value.trim().toLowerCase(),L=U();
if(L.find(x=>x.email===e))msg='Este e-mail já existe.';else{L.push(await mk(e,f.n.value.trim(),f.r.value,'Trocar@123',+f.s.value,f.c.value.trim()));S.set('users',L);msg='Funcionário admitido.'}}
else if(d==='esq'){const e=f.e.value.trim().toLowerCase();if(U().find(x=>x.email===e&&x.ativo)){const Q=S.get('reset_req',[]).filter(x=>x.e!==e);Q.push({e,ts:Date.now()});S.set('reset_req',Q)}msg='Solicitação enviada. Se o e-mail estiver cadastrado, o administrador vai definir uma senha temporária.';pg='login'}
else if(d==='reset'){const L=U(),x=L.find(y=>y.email===f.e.value);if(!u||u.role!=='adm'||!x||x.email===me)msg='Ação não permitida.';else if(!pwOk(f.n.value))msg='A senha precisa de 8+ caracteres, com letras e números.';else{x.salt=salt();x.h=await hs(f.n.value,x.salt);x.must=true;S.set('users',L);S.set('reset_req',S.get('reset_req',[]).filter(q=>q.e!==x.email));fd('redefiniu a senha de '+x.nome);msg='Senha de '+x.nome+' redefinida.'}}
else if(d==='xl'){if(!u||u.role!=='adm')msg='Ação não permitida.';else{const k=sb&&sb.value,w=f.e.value,T=S.get('ponto',[]),P=S.get('pedidos',[]),Ac=S.get('acessos',[]),ok=z=>w==='*'||z===w,mes=new Date().toLocaleDateString('pt-BR',{month:'2-digit',year:'numeric'}),Em=U().filter(x=>x.role!=='cliente'&&ok(x.email));
const hol=x=>({Funcionário:x.nome,Cargo:x.cargo,'Salário base':x.sal||0,'INSS (11%)':+((x.sal||0)*.11).toFixed(2),'Líquido':+((x.sal||0)*.89).toFixed(2),'Competência':mes});
const sh=k==='Folha de ponto'?[['Ponto',T.filter(x=>ok(x.e)).map(x=>({Funcionário:name(x.e),Tipo:x.tipo,'Data e hora':dt(x.ts)}))]]:(k==='Holerite'||k==='Pagamento')?[[k,Em.map(hol)]]:k==='Pedidos e contratos'?[['Pedidos',P.map(o=>({Pedido:o.id,Cliente:o.nome,Email:o.cli,Itens:o.itens.map(i=>i.q+'x '+i.n).join(', '),Total:o.total,Pagamento:o.pag||'',Status:o.st,Recebido:o.rec?'Sim':'Não',NF:o.nf||'',Contrato:o.doc?'Gerado em '+dt(o.doc.ts):''}))]]:[['Clientes',U().filter(x=>x.role==='cliente').map(x=>{const a=Ac.filter(y=>y.e===x.email);return{Nome:x.nome,'E-mail':x.email,Ativo:x.ativo?'Sim':'Não',Acessos:a.length,'Último acesso':a.length?dt(a[a.length-1].ts):''}})]];
msg=(await xl(sh,(k||'dados').replace(/ /g,'_')+(w==='*'?'':'_'+w.split('@')[0])+'.xlsx'))?k+' exportado.':'A biblioteca de Excel não carregou.'}}
else if(d==='feed'){fd(f.t.value.trim())}
else if(d==='msg'){const C=S.get('chats',[]),c=C.find(x=>x.id==f.dataset.c);if(c&&c.st!=='Encerrado'){c.msgs.push({de:me,t:f.t.value.trim(),ts:Date.now()});S.set('chats',C)}}
render()}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v)});
document.addEventListener('submit',e=>{e.preventDefault();submit(e.target,e.submitter)});
window.addEventListener('storage',()=>{const a=document.activeElement;if(!a||a.tagName!=='INPUT'||a.id==='ci')render()});
(async()=>{await pull();if(!S.get('users')){const L=[];for(const s of SEED_RAW)L.push(await mk(...s));S.set('users',L)}render();
setInterval(async()=>{if(await pull()){const a=document.activeElement;if(!a||a.tagName!=='INPUT'||a.id==='ci')render()}},4000)})();
</script>
